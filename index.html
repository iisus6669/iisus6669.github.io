<!DOCTYPE html>
<html>
<head>
    <meta charset= "UTF-8">
    <meta name= "viewport" content= "width= device-width, initial-scale= 1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/desktop.css">
    <link rel="stylesheet" href="css/mobile.css" media="only screen and (max-width: 768px)">
    <title>Construct</title>
</head>
<body>
    <header class="header">
        <div class="main__logo">
            <img src="img/main-logo.svg" alt="main-logo" class="main__logo__img">
            <div class="header_menu">
                <div class="Menu__tittles">Home</div>
                <div class="Menu__tittles">Services</div>
                <div class="Menu__tittles">About</div>
                <div class="Menu__tittles">Contact</div>
            </div>
            <button onclick="window.location.href='https://www.youtube.com/'" class="button__main"><img src="img/button-header.svg" alt="button-header" class="button__main__img"></button>
        </div>
        <img src="img/container-header.svg" alt="cont-header" class="cont__header">
        <img src="img/main-label.svg" alt="main-label" class="main__label">
        <img src="img/browse-our-systems.svg" alt="browse-our-systems" class="br__systems">
    </header>
    <div class="main__block">
        <img src="img/founders.svg" alt="founders" class="founders">
        <div class="buttons__founder__ahmed">
            <button onclick="window.location.href='https://www.youtube.com/'" class="button__founder">
                <img src="img/button-contact.svg" alt="button-ahmed-1" class="button__founder">
            </button>
            <button onclick="window.location.href='https://www.youtube.com/'" class="button__founder">
                <img src="img/button-projects.svg" alt="button-ahmed-2" class="button__founder">
            </button>
        </div>
        <div class="buttons__founder__nada">
            <button onclick="window.location.href='https://www.youtube.com/'" class="button__founder">
                <img src="img/button-contact.svg" alt="button-nada-1" class="button__founder">
            </button>
            <button onclick="window.location.href='https://www.youtube.com/'" class="button__founder">
                <img src="img/button-projects.svg" alt="button-nada-2" class="button__founder">
            </button>
        </div>
        <img src="img/little-tittle.svg" alt="little-tittle" class="little__tittle">
        <div class="recent__projects">
            <img src="img/block-1.svg" alt="block-1" class="project__block">
            <img src="img/block-2.svg" alt="block-2" class="project__block">
            <img src="img/block-3.svg" alt="block-3" class="project__block">
            <img src="img/block-4.svg" alt="block-4" class="project__block">
        </div>
    </div>
    <footer class="footer">
        <img src="img/footer.svg" alt="footer" class="footer">
    </footer>
</body>
</html>
